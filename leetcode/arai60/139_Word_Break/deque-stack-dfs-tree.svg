<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="900" height="700" fill="#f8f9fa"/>
  
  <!-- タイトル -->
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">
    deque（スタック）の状態変化とDFS探索木
  </text>
  <text x="450" y="55" text-anchor="middle" font-size="14" fill="#666">
    s = "catsanddog", wordDict = ["cat", "cats", "and", "sand", "dog"]
  </text>
  
  <!-- dequeの状態変化 -->
  <g transform="translate(50, 100)">
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#333">deque（スタック）の状態変化</text>
    
    <!-- 初期状態 -->
    <g transform="translate(0, 40)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">初期</text>
      <rect x="60" y="-20" width="250" height="40" fill="white" stroke="#666" stroke-width="2" rx="3"/>
      <rect x="70" y="-10" width="40" height="20" fill="#e3f2fd" stroke="#1976d2" rx="2"/>
      <text x="90" y="5" text-anchor="middle" font-size="14">0</text>
      <path d="M 290 0 L 300 -5 L 300 5 Z" fill="#ff9800"/>
      <text x="265" y="-25" font-size="11" fill="#ff9800">pop()</text>
    </g>
    
    <!-- ステップ1後 -->
    <g transform="translate(0, 100)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">Step 1</text>
      <text x="0" y="20" font-size="12" fill="#666">pop(0)</text>
      <rect x="60" y="-20" width="250" height="40" fill="white" stroke="#666" stroke-width="2" rx="3"/>
      <rect x="70" y="-10" width="40" height="20" fill="#e3f2fd" stroke="#1976d2" rx="2"/>
      <text x="90" y="5" text-anchor="middle" font-size="14">3</text>
      <rect x="110" y="-10" width="40" height="20" fill="#e3f2fd" stroke="#1976d2" rx="2"/>
      <text x="130" y="5" text-anchor="middle" font-size="14">4</text>
      <path d="M 290 0 L 300 -5 L 300 5 Z" fill="#ff9800"/>
      <text x="160" y="5" font-size="11" fill="#666">← append()</text>
    </g>
    
    <!-- ステップ2後 -->
    <g transform="translate(0, 180)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">Step 2</text>
      <text x="0" y="20" font-size="12" fill="#666">pop(4)</text>
      <rect x="60" y="-20" width="250" height="40" fill="white" stroke="#666" stroke-width="2" rx="3"/>
      <rect x="70" y="-10" width="40" height="20" fill="#e3f2fd" stroke="#1976d2" rx="2"/>
      <text x="90" y="5" text-anchor="middle" font-size="14">3</text>
      <rect x="110" y="-10" width="40" height="20" fill="#e3f2fd" stroke="#1976d2" rx="2"/>
      <text x="130" y="5" text-anchor="middle" font-size="14">7</text>
      <path d="M 290 0 L 300 -5 L 300 5 Z" fill="#ff9800"/>
    </g>
    
    <!-- ステップ3後 -->
    <g transform="translate(0, 260)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">Step 3</text>
      <text x="0" y="20" font-size="12" fill="#666">pop(7)</text>
      <rect x="60" y="-20" width="250" height="40" fill="white" stroke="#666" stroke-width="2" rx="3"/>
      <rect x="70" y="-10" width="40" height="20" fill="#e3f2fd" stroke="#1976d2" rx="2"/>
      <text x="90" y="5" text-anchor="middle" font-size="14">3</text>
      <rect x="110" y="-10" width="40" height="20" fill="#c8e6c9" stroke="#388e3c" rx="2"/>
      <text x="130" y="5" text-anchor="middle" font-size="14">10</text>
      <path d="M 290 0 L 300 -5 L 300 5 Z" fill="#ff9800"/>
    </g>
    
    <!-- ステップ4後 -->
    <g transform="translate(0, 340)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#388e3c">Step 4</text>
      <text x="0" y="20" font-size="12" fill="#388e3c">pop(10)</text>
      <rect x="60" y="-20" width="250" height="40" fill="#e8f5e9" stroke="#388e3c" stroke-width="3" rx="3"/>
      <text x="185" y="5" text-anchor="middle" font-size="14" fill="#388e3c" font-weight="bold">終端到達！</text>
    </g>
    
    <!-- visited_indexes -->
    <g transform="translate(0, 420)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">visited_indexes</text>
      <text x="0" y="25" font-size="12" fill="#666">初期: {}</text>
      <text x="0" y="45" font-size="12" fill="#666">Step 1: {0}</text>
      <text x="0" y="65" font-size="12" fill="#666">Step 2: {0, 4}</text>
      <text x="0" y="85" font-size="12" fill="#666">Step 3: {0, 4, 7}</text>
      <text x="0" y="105" font-size="12" fill="#388e3c" font-weight="bold">Step 4: 成功！</text>
    </g>
  </g>
  
  <!-- DFS探索木 -->
  <g transform="translate(500, 100)">
    <text x="100" y="0" font-size="18" font-weight="bold" fill="#333">DFS探索木</text>
    
    <!-- ノード定義 -->
    <defs>
      <circle id="visited" r="30" fill="#fff3e0" stroke="#ff9800" stroke-width="3"/>
      <circle id="success" r="30" fill="#c8e6c9" stroke="#388e3c" stroke-width="3"/>
      <circle id="unvisited" r="30" fill="#f5f5f5" stroke="#999" stroke-width="2" stroke-dasharray="5,3"/>
    </defs>
    
    <!-- エッジ -->
    <!-- 0 → 3 (未探索) -->
    <line x1="100" y1="80" x2="50" y2="180" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="60" y="125" font-size="12" fill="#999">"cat"</text>
    <text x="25" y="140" font-size="10" fill="#999">(未探索)</text>
    
    <!-- 0 → 4 (探索) -->
    <line x1="100" y1="80" x2="150" y2="180" stroke="#ff9800" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <text x="135" y="125" font-size="12" fill="#ff9800" font-weight="bold">"cats"</text>
    <text x="160" y="125" font-size="10" fill="#ff9800">①</text>
    
    <!-- 4 → 7 (探索) -->
    <line x1="150" y1="240" x2="150" y2="340" stroke="#ff9800" stroke-width="3" marker-end="url(#arrow-orange)"/>
    <text x="160" y="295" font-size="12" fill="#ff9800" font-weight="bold">"and"</text>
    <text x="200" y="295" font-size="10" fill="#ff9800">②</text>
    
    <!-- 7 → 10 (探索) -->
    <line x1="150" y1="400" x2="150" y2="500" stroke="#388e3c" stroke-width="3" marker-end="url(#arrow-green)"/>
    <text x="160" y="455" font-size="12" fill="#388e3c" font-weight="bold">"dog"</text>
    <text x="200" y="455" font-size="10" fill="#388e3c">③</text>
    
    <!-- 3 → 7 (未探索) -->
    <line x1="50" y1="240" x2="120" y2="360" stroke="#ccc" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="70" y="305" font-size="11" fill="#999">"sand"</text>
    
    <!-- 矢印定義 -->
    <defs>
      <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#ff9800"/>
      </marker>
      <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
        <polygon points="0 0, 10 3, 0 6" fill="#388e3c"/>
      </marker>
    </defs>
    
    <!-- ノード -->
    <use href="#visited" x="100" y="50"/>
    <text x="100" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">0</text>
    <text x="100" y="25" text-anchor="middle" font-size="11" fill="#666">開始</text>
    
    <use href="#unvisited" x="50" y="210"/>
    <text x="50" y="215" text-anchor="middle" font-size="16" fill="#999">3</text>
    
    <use href="#visited" x="150" y="210"/>
    <text x="150" y="215" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">4</text>
    
    <use href="#visited" x="150" y="370"/>
    <text x="150" y="375" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">7</text>
    
    <use href="#success" x="150" y="530"/>
    <text x="150" y="535" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">10</text>
    <text x="150" y="570" text-anchor="middle" font-size="12" fill="#388e3c" font-weight="bold">終端</text>
    
    <!-- 凡例 -->
    <g transform="translate(250, 450)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#333">凡例</text>
      <circle cx="10" cy="20" r="10" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
      <text x="30" y="25" font-size="12" fill="#666">探索済み</text>
      
      <circle cx="10" cy="45" r="10" fill="#f5f5f5" stroke="#999" stroke-width="2" stroke-dasharray="3,2"/>
      <text x="30" y="50" font-size="12" fill="#666">未探索</text>
      
      <circle cx="10" cy="70" r="10" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
      <text x="30" y="75" font-size="12" fill="#666">成功</text>
    </g>
  </g>
  
  <!-- 探索順序の説明 -->
  <g transform="translate(50, 620)">
    <rect x="0" y="0" width="800" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="5"/>
    <text x="400" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">探索順序（LIFO）</text>
    <text x="400" y="45" text-anchor="middle" font-size="12" fill="#666">
      0 → 4 → 7 → 10 (成功) ｜ 位置3は探索されずに終了
    </text>
  </g>
</svg>